apiVersion: v1
kind: Service
metadata:
  name: groww-web-service
spec:
  selector:
    app: groww
  type: NodePort
  ports:
    - port: 80
```[cite: 2]

*(Optional note: If your container inside the pod listens on a specific port like `8080` or `3000`, you can add `targetPort: 8080` under `- port: 80`, or `nodePort: 30080` if you want a fixed external port instead of an auto-assigned one in the 30000–32767 range.)*
