apiVersion: apps/v1
kind: Deployment
metadata:
  name: groww-custom-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: groww
  template:
    metadata:
      labels:
        app: groww
    spec:
      containers:
        - name: growwlp-container
          image: growwlp.azurecr.io/growwlp:v1.0.0
          ports:
            - containerPort: 5000
      imagePullSecrets:
        - name: growwacrsecret
